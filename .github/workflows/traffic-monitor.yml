name: 📈 Repository Traffic Monitor

on:
  # schedule:
  #   # Run automatically every day at midnight UTC (00:00)
  #   - cron: '0 0 * * *'
  workflow_dispatch:  # Allows manual triggering from GitHub Actions UI

permissions:
  contents: write

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 Fetch and Merge Traffic Analytics
        env:
          # If the default GITHUB_TOKEN experiences a 403 Forbidden on the traffic API,
          # create a Repository Secret named TRAFFIC_TOKEN containing a fine-grained PAT with Read access to repository metadata/administration.
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/update_traffic.py
          python .github/scripts/update_traffic.py

      - name: 💾 Commit updated traffic analytics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/traffic/history.json Inbox/Repository-Traffic-Report.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(traffic): automated daily repository traffic & clone stats logging [skip ci]"
            git push
          else
            echo "No changes in traffic statistics today."
          fi
